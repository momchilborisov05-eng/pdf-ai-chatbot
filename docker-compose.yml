# Local run with Docker:  docker compose up --build   ->  http://localhost:8000
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY first}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.00}
    volumes:
      - pdf-chat-data:/data
    restart: unless-stopped

volumes:
  pdf-chat-data:
